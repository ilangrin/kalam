<title>כלאם</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: phone-first app shell. A winding lesson path (units of 10), a full-screen exercise runner, bottom tab bar.
   "Cloud & coral": warm cloud-white ground, coral = Palestinian street dialect + main actions,
   violet-indigo = formal Arabic, sun-yellow = rewards (XP, streak, finished lessons). */
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --ink:#1B1A2E; --muted:#6B6878; --line:#E6E1D8;
  --pal:#FF6A3D; --pal-d:#D9481E; --pal-soft:#FFEDE5; --pal-ink:#C2410C;
  --fus:#5B4BDB; --fus-d:#3F31B0; --fus-soft:#ECEBFF; --fus-ink:#4338CA;
  --gold:#FFB020; --gold-d:#D18A00; --gold-soft:#FFF3D6; --gold-ink:#B45309;
  --ok:#14A37A; --ok-soft:#DDF5EC; --bad:#E5484D; --bad-soft:#FDE7E7;
  --lock:#E4E0D8; --lock-d:#CCC6BB; --on:#FFFFFF;
  --f-ui:"Rubik","Segoe UI",system-ui,sans-serif; --f-ar:"Noto Naskh Arabic","Geeza Pro","Arial",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121220; --surface:#1C1B2E; --ink:#F2F0FF; --muted:#A3A0B8; --line:#2D2B45;
  --pal:#FF7A50; --pal-d:#C2471F; --pal-soft:#3A2220; --pal-ink:#FFAA88;
  --fus:#9B8CFF; --fus-d:#6252D9; --fus-soft:#24224A; --fus-ink:#BDB3FF;
  --gold:#FFC046; --gold-d:#B88300; --gold-soft:#3A2E14; --gold-ink:#FFC046;
  --ok:#3DD69A; --ok-soft:#133528; --bad:#FF6B6F; --bad-soft:#3E1C1E;
  --lock:#2E2C42; --lock-d:#22213A; --on:#1A1222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121220; --surface:#1C1B2E; --ink:#F2F0FF; --muted:#A3A0B8; --line:#2D2B45;
  --pal:#FF7A50; --pal-d:#C2471F; --pal-soft:#3A2220; --pal-ink:#FFAA88;
  --fus:#9B8CFF; --fus-d:#6252D9; --fus-soft:#24224A; --fus-ink:#BDB3FF;
  --gold:#FFC046; --gold-d:#B88300; --gold-soft:#3A2E14; --gold-ink:#FFC046;
  --ok:#3DD69A; --ok-soft:#133528; --bad:#FF6B6F; --bad-soft:#3E1C1E;
  --lock:#2E2C42; --lock-d:#22213A; --on:#1A1222; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important} /* the artifact viewer adds this; the Android app has no such wrapper */
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;direction:rtl}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--fus);outline-offset:2px}
.px{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ar{font-family:var(--f-ar);direction:rtl;font-weight:700;line-height:1.55}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px}
@media (max-width:430px){.bname{display:none} .pills{gap:4px} .pill{padding:2px 7px;font-size:.8rem;gap:3px} .pill svg{width:14px;height:14px} .pill.words{display:none} .seg button{padding:4px 7px;font-size:.7rem}}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem}
.brand .logo{width:36px;height:36px;border-radius:10px;box-shadow:0 2px 0 var(--line)}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-size:.92rem}
.pill svg{width:18px;height:18px}
.pill.streak{color:var(--gold-ink)} .pill.streak.off{color:var(--muted)}
.pill.xp{color:var(--fus-ink)} .pill.words{color:var(--pal-ink)}

main{max-width:560px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.today-line{color:var(--muted);font-size:.9rem;margin:0 0 12px}

/* path */
.unit{border-radius:18px;background:var(--pal);color:var(--on);padding:14px 16px;box-shadow:0 4px 0 var(--pal-d);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.unit:first-child{margin-top:0}
.unit.u-alt{background:var(--fus);box-shadow:0 4px 0 var(--fus-d)}
.unit.u-lock{background:var(--lock);box-shadow:0 4px 0 var(--lock-d);color:var(--muted)}
.unit h2{margin:0;font-size:1.05rem;font-weight:800}
.unit p{margin:2px 0 0;font-size:.86rem;opacity:.9}
.unit .cnt{font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 0 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:70px;height:66px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;transition:transform .08s}
.node svg{width:30px;height:30px}
.node:active{transform:translateY(4px)}
.node.done{background:var(--gold);color:var(--on);box-shadow:0 6px 0 var(--gold-d)}
.node.open{background:var(--pal);color:var(--on);box-shadow:0 6px 0 var(--pal-d)}
.node.cur{width:84px;height:78px;background:var(--pal);color:var(--on);box-shadow:0 7px 0 var(--pal-d),0 0 0 7px var(--pal-soft)}
.node.locked{background:var(--lock);color:var(--muted);box-shadow:0 6px 0 var(--lock-d)}
.bubble{position:absolute;bottom:calc(100% + 14px);white-space:nowrap;background:var(--surface);border:2px solid var(--line);color:var(--pal-ink);font-weight:800;padding:6px 14px;border-radius:12px;font-size:.92rem;z-index:2}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--line)}
@media (prefers-reduced-motion:no-preference){.bubble{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}}
.node-cap{font-size:.75rem;color:var(--muted);margin-top:10px;max-width:120px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tipcard{margin-top:18px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:.92rem}
.tipcard b{display:block;margin-bottom:2px}
.tipcard .x{margin-inline-start:auto;background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:1.1rem}

/* generic 3D buttons */
.b3{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:16px;padding:14px 20px;font-weight:800;font-size:1rem;letter-spacing:.02em;cursor:pointer;background:var(--pal);color:var(--on);box-shadow:0 4px 0 var(--pal-d);width:100%;transition:transform .06s}
.b3:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pal-d)}
.b3[disabled]{background:var(--lock);color:var(--muted);box-shadow:0 4px 0 var(--lock-d);cursor:default;transform:none}
.b3.fus{background:var(--fus);box-shadow:0 4px 0 var(--fus-d)}
.b3.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
.b3.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.b3.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* practice tab */
.hero{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.hero h2{margin:0;font-size:1.3rem;font-weight:800;text-wrap:balance}
.hero p{margin:0;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.wd i{width:28px;height:28px;border-radius:50%;background:var(--lock);display:grid;place-items:center;font-style:normal}
.wd.on i{background:var(--gold);color:var(--on)}
.wd.rest i{background:transparent;border:2px dashed var(--line)}
.wd.now{color:var(--ink);font-weight:700}
.sec-h{font-size:1rem;font-weight:800;margin:22px 0 8px}

/* dictionary */
.search{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.search:focus{outline:none;border-color:var(--fus)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin:10px 2px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;background:var(--c)}
.dict{background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:12px 14px;border-bottom:2px solid var(--line)}
.row:last-child{border-bottom:none}
.row.one{grid-template-columns:1fr}
#modeTop{flex:none}
.seg{display:flex;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:2px;gap:2px}
.seg button{border:none;background:none;border-radius:99px;padding:4px 8px;font-weight:700;font-size:.74rem;line-height:1.3;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--pal);color:var(--on)}
.seg button[data-mode="fus"][aria-pressed="true"]{background:var(--fus)}
.seg button[data-mode="both"][aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row .he{grid-column:1/-1;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.row .he small{font-weight:400;color:var(--muted);font-size:.78rem}
.mini{display:flex;align-items:center;gap:8px;min-width:0;background:var(--bg);border:none;border-radius:12px;padding:6px 10px;text-align:right;cursor:pointer}
.mini .ar{font-size:1.15rem;display:block}
.mini .tr{font-size:.82rem;color:var(--muted)}
.mini .dot{width:9px;height:9px;border-radius:50%;flex:none}
.mini.p .dot{background:var(--pal)} .mini.f .dot{background:var(--fus)}
.empty{padding:18px;color:var(--muted);text-align:center}

/* tab bar */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:7;background:var(--surface);border-top:2px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:flex;gap:6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 4px;color:var(--muted);font-weight:700;font-size:.8rem;cursor:pointer}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--pal-ink);background:var(--pal-soft);border-color:color-mix(in srgb,var(--pal) 35%,transparent)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 40%,transparent);z-index:20}
.sheet{position:fixed;inset:auto 0 0 0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:1.25rem;font-weight:800}
.sheet .words{display:flex;gap:8px;flex-wrap:wrap}
.sheet .wchip{background:var(--pal-soft);color:var(--pal-ink);font-weight:700;padding:6px 12px;border-radius:99px}
.sheet .sub{color:var(--muted);font-size:.9rem;margin:0}

/* runner */
.runner{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.r-top{max-width:560px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:12px}
.r-x{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:grid;place-items:center}
.r-x svg{width:26px;height:26px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--lock);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pal);border-radius:99px;transition:width .35s ease;box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 12%,transparent)}
.r-main{flex:1;overflow-y:auto}
.r-body{max-width:560px;margin:0 auto;padding-block:8px 20px;display:flex;flex-direction:column;gap:16px}
.kind{font-size:1.3rem;font-weight:800;margin:0;text-wrap:balance}
.tag{align-self:flex-start;font-size:.78rem;font-weight:800;letter-spacing:.06em;padding:4px 12px;border-radius:99px;background:var(--fus-soft);color:var(--fus-ink)}
.tag.new{background:var(--pal-soft);color:var(--pal-ink)}
.tag.bonus{background:var(--gold-soft);color:var(--gold-ink)}
.meaning{font-size:2rem;font-weight:800;margin:0;text-wrap:balance}
.ver{border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;border:2px solid transparent}
.ver.pal{background:var(--pal-soft);border-color:color-mix(in srgb,var(--pal) 30%,transparent)}
.ver.fus{background:var(--fus-soft);border-color:color-mix(in srgb,var(--fus) 30%,transparent)}
.ver .lab{grid-column:1/-1;font-size:.74rem;font-weight:800;letter-spacing:.05em}
.ver.pal .lab{color:var(--pal-ink)} .ver.fus .lab{color:var(--fus-ink)}
.ver .ar{font-size:2.1rem}
.ver .tr{font-size:1.15rem}
.plays{display:flex;gap:8px;grid-column:2;grid-row:2/4}
.play{width:52px;height:50px;border-radius:14px;border:none;display:grid;place-items:center;cursor:pointer;color:var(--on)}
.play svg{width:24px;height:24px}
.play.p{background:var(--pal);box-shadow:0 4px 0 var(--pal-d)} .play.f{background:var(--fus);box-shadow:0 4px 0 var(--fus-d)}
.play.slow{width:42px;font-weight:800;font-size:.78rem}
.play:active{transform:translateY(3px);box-shadow:none}
.tipline{color:var(--muted);font-size:.95rem;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:10px 14px}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prompt .ar{font-size:2.2rem}
.prompt .tr{color:var(--muted);font-size:1.05rem}
.bigplay{width:96px;height:90px;border-radius:24px}
.bigplay svg{width:42px;height:42px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:14px 10px;cursor:pointer;text-align:center;min-width:0;font-weight:700;font-size:1.05rem;transition:transform .06s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .ar{display:block;font-size:1.5rem}
.opt .tr{display:block;font-weight:400;font-size:.88rem;color:var(--muted)}
.opt.sel{border-color:var(--fus);background:var(--fus-soft);box-shadow:0 4px 0 var(--fus)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}
.opt[disabled]{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.opt.gone{opacity:.35;box-shadow:none;border-color:var(--line);background:var(--bg)}
@media (prefers-reduced-motion:no-preference){.opt.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}}
.r-foot{border-top:2px solid var(--line);background:var(--bg)}
.r-foot.ok{background:var(--ok-soft);border-color:transparent}
.r-foot.bad{background:var(--bad-soft);border-color:transparent}
.r-foot-in{max-width:560px;margin:0 auto;padding-block:14px 16px;display:flex;flex-direction:column;gap:12px}
.fb{display:flex;gap:10px;align-items:flex-start}
.fb .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--on)}
.fb .ic svg{width:22px;height:22px}
.ok .fb .ic{background:var(--ok)} .bad .fb .ic{background:var(--bad)}
.fb h4{margin:0;font-size:1.15rem;font-weight:800}
.ok .fb h4{color:var(--ok)} .bad .fb h4{color:var(--bad)}
.fb p{margin:2px 0 0;font-size:.95rem}
.fb .ar{font-size:1.2rem}
.done-screen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:30px}
.medal{width:120px;height:120px;border-radius:50%;background:var(--gold);color:var(--on);display:grid;place-items:center;box-shadow:0 8px 0 var(--gold-d),0 0 0 12px var(--gold-soft)}
.medal svg{width:60px;height:60px}
.done-screen h2{margin:16px 0 0;font-size:1.7rem;font-weight:800}
.done-screen p{margin:0;color:var(--muted)}
.rew{display:flex;gap:10px;width:100%}
.rew div{flex:1;border:2px solid var(--line);border-radius:16px;padding:10px;background:var(--surface)}
.rew b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.rew .x b{color:var(--fus-ink)} .rew .s b{color:var(--gold-ink)} .rew .a b{color:var(--ok)}
.rew span{font-size:.78rem;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:90vw;z-index:40;text-align:center}

  return c;
}

/* ---------- audio: recorded clips shipped with the app; device voice only as fallback ---------- */
const AC={};
let curAudio=null;
function clipSrc(id,k){return "audio/"+String(id).padStart(3,"0")+k+".mp3"}
function say(id,k,slow){
  const src=clipSrc(id,k); const a=AC[src]||(AC[src]=new Audio(src));
  if(curAudio&&curAudio!==a)curAudio.pause();
  curAudio=a; a.currentTime=0; a.playbackRate=slow?0.7:1; a.preservesPitch=true;
  const p=a.play(); if(p&&p.catch)p.catch(()=>deviceVoice(W[id][k==="p"?"pal":"fus"].ar,slow));
}
function deviceVoice(text,slow){
  if(!("speechSynthesis" in window)){toast("לא הצלחתי להשמיע. בדוק שהשמע בטלפון לא מושתק.");return}
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/[!?؟]/g,"").replace(/\s*\/\s*/g,"، "));
  u.lang="ar-SA"; const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang)); if(v)u.voice=v; u.rate=slow?0.6:0.9; speechSynthesis.speak(u);
}

const OFFS=[0,52,82,52,0,-52,-82,-52];
function unitInfo(u){
  const ws=W.filter(w=>Math.ceil(w.day/10)===u+1), c={};
  ws.forEach(w=>c[w.cat]=(c[w.cat]||0)+1);
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  return top.join(" · ");
}
function firstOpen(){for(let k=1;k<=N;k++)if(!S.done[k])return k;return null}
function renderLearn(){
  const units=Math.ceil(MAXDAY/10), cur=firstOpen();
  let h=`<p class="today-line">${fmtDate(TODAY)} · ${isLessonDay(TODAY)?`שיעור ${N} נפתח היום`:"סוף שבוע, אין שיעור חדש. זמן טוב לחזרה"}</p>`;
  for(let u=0;u<units;u++){
    const from=u*10+1,to=Math.min(MAXDAY,u*10+10);
    const doneCnt=[...Array(to-from+1)].filter((_,i)=>S.done[from+i]).length;
    const locked=from>N;
    h+=`<section><div class="unit ${locked?"u-lock":u%2?"u-alt":""}"><div><h2>יחידה ${u+1}</h2><p>${esc(unitInfo(u))}</p></div><span class="cnt">${doneCnt}/${to-from+1}</span></div><div class="path">`;
    for(let k=from;k<=to;k++){
      const off=OFFS[(k-1)%8];
      const st=S.done[k]?"done":k>N?"locked":k===cur?"cur":"open";
      const icon=st==="done"?I.check:st==="locked"?I.lock:st==="cur"?I.star:k;
      const cap=byDay(k).map(w=>w.he).join(" · ");
      h+=`<div class="node-wrap" style="transform:translateX(${off}px)">${st==="cur"?`<span class="bubble">${S.xp||Object.keys(S.done).length?"המשך":"התחל"}</span>`:""}<button class="node ${st}" data-day="${k}" id="node-${k}" aria-label="שיעור ${k}: ${esc(cap)}">${icon}</button><span class="node-cap">${st==="locked"?"שיעור "+k:esc(cap)}</span></div>`;
    }
    h+=`</div></section>`;
    if(locked&&u>Math.ceil(N/10))break; // show one locked unit as a teaser
  }

  if(!hideTip)h+=`<div class="tipcard"><div><b>להוספה למסך הבית בסמסונג</b>בכרום: תפריט ⋮ ← "הוסף למסך הבית". כך כלאם נפתחת כמו אפליקציה.</div><button class="x" data-act="hidetip" aria-label="הסתר">✕</button></div>`;
  return h;

/* ---------- exercises ---------- */
/* Learning mode (S.mode): "pal" = Palestinian only, "fus" = formal only, "both" = side by side. k = "p" | "f". */
const KEY=k=>k==="p"?"pal":"fus";
const MODE=()=>["pal","fus","both"].includes(S.mode)?S.mode:"both";
const KS=()=>MODE()==="pal"?["p"]:MODE()==="fus"?["f"]:["p","f"];
const PK=()=>MODE()==="fus"?"f":"p";
const LANG={p:"פלסטינית",f:"ערבית רשמית"};
let R=null;
function distract(w,n,field){
  const seen=new Set([w.he,field==="he"?w.he:w[field].ar]);
  const pool=shuffle(W.filter(x=>x.id!==w.id)).sort((a,b)=>(b.day<=N)-(a.day<=N));
  const out=[]; for(const x of pool){const key=field==="he"?x.he:x[field].ar; if(seen.has(key)||seen.has(x.he))continue; seen.add(key);seen.add(x.he);out.push(x); if(out.length===n)break}
  return out;
}
function q(t,w,k){const field=t==="he2ar"?KEY(k):t==="pal2fus"?"fus":"he";return{t,w,k,opts:shuffle([w,...distract(w,3,field)])}}
function buildLesson(day){
  const ws=byDay(day), b=bonusFor(day), P=PK(), s=[];
  ws.forEach(w=>{s.push({t:"intro",w});s.push(q("listen",w,P))});
  ws.forEach(w=>s.push(q("he2ar",w,P)));
  if(MODE()==="both"){if(ws[0])s.push(q("pal2fus",ws[0],"p")); if(ws[1])s.push(q("ar2he",ws[1],"f"))}
  else ws.forEach(w=>s.push(q("ar2he",w,P)));
  const extra=shuffle(W.filter(x=>x.day<day&&!ws.includes(x)&&x!==b)).slice(0,b?1:2);
  const pairs=[...ws,...(b?[b]:[]),...extra]; if(pairs.length>=3)s.push({t:"match",pairs,k:P});
  if(b){s.push({t:"intro",w:b,bonus:true});s.push(q("he2ar",b,P))}
  return s;
}
function buildPractice(){
  const P=PK(), pool=shuffle(unlocked()), s=[];
  const kinds=MODE()==="both"?[["listen","p"],["he2ar","p"],["pal2fus","p"],["ar2he","f"],["listen","f"],["he2ar","f"]]:[["listen",P],["he2ar",P],["ar2he",P]];
  for(let i=0;i<10;i++){const [t,k]=kinds[Math.floor(Math.random()*kinds.length)];s.push(q(t,pool[i%pool.length],k))}
  if(pool.length>=4)s.splice(5,0,{t:"match",pairs:pool.slice(0,4),k:P});
  return s;
}
function startRun(kind,k){
  closeSheet();
  R={kind,day:k,steps:kind==="lesson"?buildLesson(k):buildPractice(),i:0,mistakes:0,correct:0,phase:"ask",sel:null};
  R.base=R.steps.length;
  document.getElementById("runner").hidden=false; document.body.classList.add("lock");
  drawStep();
}
function closeRun(){R=null;document.getElementById("runner").hidden=true;document.body.classList.remove("lock");render()}
function verBlock(w,k){
  const key=KEY(k), lab=k==="p"?"פלסטינית · מה ששומעים ברחוב":"ערבית רשמית · חדשות ומסמכים";
  return `<div class="ver ${key}"><span class="lab">${lab}</span><span class="ar" lang="ar">${esc(w[key].ar)}</span>
   <div class="plays"><button class="play ${k}" data-say="${w.id}" data-k="${k}" aria-label="השמע">${I.play}</button><button class="play ${k} slow" data-say="${w.id}" data-k="${k}" data-slow="1" aria-label="השמע לאט">לאט</button></div>
   <span class="tr">${esc(w[key].tr)}</span></div>`;
}
function optHtml(o,st){
  if(st.t==="he2ar"){const key=KEY(st.k);return `<span class="ar" lang="ar">${esc(o[key].ar)}</span><span class="tr">${esc(o[key].tr)}</span>`}
  if(st.t==="pal2fus")return `<span class="ar" lang="ar">${esc(o.fus.ar)}</span><span class="tr">${esc(o.fus.tr)}</span>`;
  return esc(o.he);
}
function answerLine(w){
  const ks=KS();
  if(ks.length===1){const key=KEY(ks[0]);return `${esc(w.he)} = <span class="ar" lang="ar">${esc(w[key].ar)}</span> ${esc(w[key].tr)}`}
  return `${esc(w.he)} = <span class="ar" lang="ar">${esc(w.pal.ar)}</span> ${esc(w.pal.tr)} · רשמי: ${esc(w.fus.tr)}`;
}
function drawStep(){
  const st=R.steps[R.i], pct=Math.round(R.i/R.steps.length*100);
  let body="", foot="";
  if(st.t==="intro"){
    const w=st.w;
    body=`<span class="tag ${st.bonus?"bonus":"new"}">${st.bonus?"בונוס חזרה · משיעור "+w.day:"מילה חדשה"}</span><p class="meaning">${esc(w.he)}</p>
     ${KS().map(k=>verBlock(w,k)).join("")}${w.tip?`<div class="tipline">${esc(w.tip)}</div>`:""}`;
    foot=`<button class="b3" data-act="next">המשך</button>`;
    setTimeout(()=>say(w.id,PK()),250);
  }else if(st.t==="match"){
    R.m=R.m||{a:null,h:null,got:new Set(),L:shuffle(st.pairs),Rr:shuffle(st.pairs)};
    const m=R.m, key=KEY(st.k);
    const tile=(w,side)=>`<button class="opt ${m.got.has(w.id)?"gone":""} ${(side==="a"?m.a:m.h)===w.id?"sel":""}" data-match="${side}" data-id="${w.id}" ${m.got.has(w.id)?"disabled":""}>${side==="a"?`<span class="ar" lang="ar">${esc(w[key].ar)}</span>`:esc(w.he)}</button>`;
    body=`<p class="kind">חבר כל מילה לפירוש שלה</p><div class="match"><div class="col">${m.L.map(w=>tile(w,"a")).join("")}</div><div class="col">${m.Rr.map(w=>tile(w,"h")).join("")}</div></div>`;
    foot=`<button class="b3" data-act="next" ${m.got.size===st.pairs.length?"":"disabled"}>המשך</button>`;
  }else{
    const w=st.w, k=st.k, key=KEY(k);
    let prompt="";
    if(st.t==="listen")prompt=`<p class="kind">מה שמעת?</p><div class="prompt"><button class="play ${k} bigplay" data-say="${w.id}" data-k="${k}" aria-label="השמע שוב">${I.play}</button><button class="play ${k} slow" data-say="${w.id}" data-k="${k}" data-slow="1">לאט</button></div>`;
    else if(st.t==="he2ar")prompt=`<p class="kind">איך אומרים ב${LANG[k]}?</p><p class="meaning">${esc(w.he)}</p>`;
    else if(st.t==="pal2fus")prompt=`<p class="kind">מה המקבילה בערבית הרשמית?</p><div class="prompt"><button class="play p" data-say="${w.id}" data-k="p" aria-label="השמע">${I.play}</button><div><span class="ar" lang="ar">${esc(w.pal.ar)}</span><br><span class="tr">${esc(w.pal.tr)}</span></div></div>`;
    else prompt=`<p class="kind">${k==="f"&&MODE()==="both"?"מה פירוש המילה הרשמית?":"מה פירוש המילה?"}</p><div class="prompt"><button class="play ${k}" data-say="${w.id}" data-k="${k}" aria-label="השמע">${I.play}</button><div><span class="ar" lang="ar">${esc(w[key].ar)}</span><br><span class="tr">${esc(w[key].tr)}</span></div></div>`;
    const answered=R.phase!=="ask";
    body=prompt+`<div class="opts">${st.opts.map(o=>{let c="";if(answered){if(o.id===w.id)c="right";else if(o.id===R.sel)c="wrong"}else if(o.id===R.sel)c="sel";return `<button class="opt ${c}" data-opt="${o.id}" ${answered?"disabled":""}>${optHtml(o,st)}</button>`}).join("")}</div>`;
    if(!answered)foot=`<button class="b3" data-act="check" ${R.sel==null?"disabled":""}>בדוק</button>`;
    else{
      const ok=R.phase==="ok";
      foot=`<div class="fb"><span class="ic">${ok?I.check:I.cross}</span><div><h4>${ok?["מצוין!","נכון!","יפה מאוד!","בדיוק!"][Math.floor(Math.random()*4)]:"התשובה הנכונה:"}</h4>
       <p>${answerLine(w)}</p></div></div>
       <button class="b3 ${ok?"":"bad"}" data-act="next">המשך</button>`;
    }
    if(st.t==="listen"&&R.phase==="ask"&&R.sel==null)setTimeout(()=>say(w.id,k),250);
  }
  const fc=R.phase==="ok"?"ok":R.phase==="bad"?"bad":"";
  document.getElementById("runner").innerHTML=`<div class="r-top px"><button class="r-x" data-act="quit" aria-label="יציאה">${I.cross}</button><div class="bar"><i style="width:${pct}%"></i></div></div>
   <div class="r-main"><div class="r-body px">${body}</div></div>
   <div class="r-foot px ${fc}"><div class="r-foot-in">${foot}</div></div>`;
}
function check(){
  const st=R.steps[R.i]; const ok=R.sel===st.w.id;
  R.phase=ok?"ok":"bad";
  if(ok){R.correct++;S.right++}else{R.mistakes++;S.wrong++;R.steps.push(q(st.t,st.w,st.k))}
  say(st.w.id,st.t==="pal2fus"?"f":st.k); drawStep(); save();
  if(ok)autoNext(1400); // right answer: move on by itself after the praise and the word is heard
}
function autoNext(ms){const run=R,at=R.i;setTimeout(()=>{if(R===run&&R.i===at&&R.phase!=="bad")next()},ms)}
function next(){
  R.i++; R.sel=null; R.phase="ask"; R.m=null;
  if(R.i>=R.steps.length)return finish();
  drawStep();
}
function finish(){
  let gain;
  if(R.kind==="lesson"){
    const again=!!S.done[R.day];
    gain=(again?10:20)+(R.mistakes===0?5:0);
    S.done[R.day]=S.done[R.day]||Date.now();
    byDay(R.day).forEach(w=>S.learned[w.id]=S.learned[w.id]||Date.now());
  }else gain=R.correct;
  S.xp+=gain; markActive(); save();
  const asked=R.correct+R.mistakes, acc=asked?Math.round(R.correct/asked*100):100;
  const nextK=firstOpen();
  document.getElementById("runner").innerHTML=`<div class="r-main"><div class="r-body px"><div class="done-screen">
   <div class="medal">${I.trophy}</div>
   <h2>${R.kind==="lesson"?`שיעור ${R.day} הושלם!`:"התרגול הושלם!"}</h2>
   <p>${R.mistakes===0?"בלי טעויות. ככה בונים אוזן לערבית.":"כל טעות חזרה שוב עד שהצלחת. ככה זה נקלט."}</p>
   <div class="rew"><div class="x"><b>+${gain}</b><span>נקודות</span></div><div class="s"><b>${streak()}</b><span>ימי רצף</span></div><div class="a"><b>${acc}%</b><span>דיוק</span></div></div>
  </div></div></div>
  <div class="r-foot px"><div class="r-foot-in">${R.kind==="lesson"&&nextK?`<button class="b3" data-act="start" data-day="${nextK}">לשיעור ${nextK}</button>`:""}<button class="b3 ${R.kind==="lesson"&&nextK?"ghost":""}" data-act="quit">חזרה למסלול</button></div></div>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b){if(e.target.id==="scrim")closeSheet();return}
  if(b.dataset.say){say(+b.dataset.say,b.dataset.k,!!b.dataset.slow);return}
  if(b.dataset.tab){tab=b.dataset.tab;history.replaceState(null,"","#"+tab);if(tab!=="dict")dq="";render();window.scrollTo(0,0);return}
  if(b.classList.contains("node")){const k=+b.dataset.day;if(k>N){toast(`שיעור ${k} ייפתח ב${fmtDate(lessonDate(k))}`);return}openSheet(k);return}
  if(b.dataset.mode){S.mode=b.dataset.mode;save();render();toast(S.mode==="pal"?"מעכשיו: פלסטינית בלבד":S.mode==="fus"?"מעכשיו: ערבית רשמית בלבד":"מעכשיו: פלסטינית ורשמית יחד");return}
  const a=b.dataset.act;
  if(a==="closesheet")return closeSheet();
  if(a==="start"){if(R)R=null;return startRun("lesson",+b.dataset.day)}
  if(a==="practice")return startRun("practice");
  if(a==="quit")return closeRun();
  if(a==="next")return next();
  if(a==="check")return check();
  if(a==="hidetip"){try{localStorage.setItem("kalam-tip","1")}catch(e){}render();return}
  if(b.dataset.opt&&R&&R.phase==="ask"){
    R.sel=+b.dataset.opt; const st=R.steps[R.i];
    if(st.t==="he2ar")say(R.sel,st.k); else if(st.t==="pal2fus")say(R.sel,"f");
    drawStep(); return;
  }
  if(b.dataset.match&&R&&R.m){
    const m=R.m, id=+b.dataset.id, st=R.steps[R.i];
    if(b.dataset.match==="a"){m.a=id;say(id,st.k)}else m.h=id;
    if(m.a!=null&&m.h!=null){
      if(m.a===m.h){m.got.add(m.a);m.a=m.h=null;drawStep()}
      else{const ids=[m.a,m.h];m.a=m.h=null;R.mistakes++;drawStep();
        ids.forEach((x,i)=>{const el=document.querySelector(`[data-match="${i?"h":"a"}"][data-id="${x}"]`);if(el){el.classList.add("wrong","shake");setTimeout(()=>el.classList.remove("wrong","shake"),450)}})}
      if(m.got.size===st.pairs.length){S.right++;save();autoNext(900)}
    }else drawStep();
    return;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="search"){dq=e.target.value.trim();document.getElementById("dictbox").innerHTML=dictRows()}});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["learn","practice","dict"].includes(h)&&h!==tab){tab=h;render()}});
render();
if(tab==="learn"){const k=firstOpen()||N;const el=document.getElementById("node-"+k);if(el&&k>4)setTimeout(()=>el.scrollIntoView({block:"center"}),60)}
</script>
